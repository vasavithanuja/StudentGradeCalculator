<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student Grade Calculator</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

    <header class="home-header">

        <div>

            <p class="hello">
                Hello 👋
            </p>

            <h1 id="welcomeName">
                Student
            </h1>

        </div>

        <button
            class="logout-btn"
            onclick="logoutUser()"
        >
            Logout
        </button>

    </header>


    <main class="home-content">


        <div class="welcome-card">

            <div class="card-icon">
                🧮
            </div>

            <h2>
                Student Grade Calculator
            </h2>

            <p>
                Enter your marks and calculate
                your total, percentage, grade
                and result easily.
            </p>

            <a
                href="#calculator"
                class="start-btn"
            >
                Start Calculator →
            </a>

        </div>


        <div
            id="calculator"
            class="calculator-card"
        >

            <h2>
                Enter Student Details
            </h2>


            <label>
                Student Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter student name"
            >


            <label>
                Roll Number
            </label>

            <input
                type="text"
                id="roll"
                placeholder="Enter roll number"
            >


            <h3>
                Subject Marks
            </h3>


            <div class="subject">

                <span>
                    Subject 1
                </span>

                <input
                    type="number"
                    id="sub1"
                    placeholder="0"
                    min="0"
                    max="100"
                >

            </div>


            <div class="subject">

                <span>
                    Subject 2
                </span>

                <input
                    type="number"
                    id="sub2"
                    placeholder="0"
                    min="0"
                    max="100"
                >

            </div>


            <div class="subject">

                <span>
                    Subject 3
                </span>

                <input
                    type="number"
                    id="sub3"
                    placeholder="0"
                    min="0"
                    max="100"
                >

            </div>


            <div class="subject">

                <span>
                    Subject 4
                </span>

                <input
                    type="number"
                    id="sub4"
                    placeholder="0"
                    min="0"
                    max="100"
                >

            </div>


            <div class="subject">

                <span>
                    Subject 5
                </span>

                <input
                    type="number"
                    id="sub5"
                    placeholder="0"
                    min="0"
                    max="100"
                >

            </div>


            <button
                class="calculate-btn"
                onclick="calculateGrade()"
            >
                Calculate Result
            </button>

        </div>

    </main>


    <nav class="bottom-nav">

        <a href="dashboard.html">

            <span>📊</span>

            Dashboard

        </a>


        <a
            href="index.html"
            class="active"
        >

            <span>🏠</span>

            Home

        </a>


        <a href="#calculator">

            <span>🧮</span>

            Calculator

        </a>


        <a href="result.html">

            <span>🏆</span>

            Result

        </a>

    </nav>

</div>

<script src="script.js"></script>

</body>
</html>
