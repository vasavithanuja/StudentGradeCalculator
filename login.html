<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Student Grade Calculator</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

    <div class="auth-header">

        <div class="logo">🎓</div>

        <h1>Student Grade Calculator</h1>

        <p>Welcome back!</p>

    </div>


    <div class="auth-card">

        <h2>Login</h2>

        <p class="small-text">
            Login to continue to your calculator
        </p>


        <label>Email</label>

        <input
            type="email"
            id="loginEmail"
            placeholder="Enter your email"
        >


        <label>Password</label>

        <input
            type="password"
            id="loginPassword"
            placeholder="Enter your password"
        >


        <button onclick="loginUser()">
            Login
        </button>


        <p class="switch-text">

            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </p>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
